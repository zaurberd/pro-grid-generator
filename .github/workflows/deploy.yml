# Deploys to VPS when a release is published (i.e. after you merge the Release Please PR).
# Triggers: release published, or manual Run workflow.
# GitHub repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, GHCR_TOKEN (PAT with read:packages for pull on VPS)

name: Deploy to VPS

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}:latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            for i in 1 2 3; do docker pull ${{ env.IMAGE }} && break || sleep 15; done
            docker stop pro-grid-generator 2>/dev/null || true
            docker rm pro-grid-generator 2>/dev/null || true
            docker run -d --name pro-grid-generator -p 3002:3000 --restart unless-stopped ${{ env.IMAGE }}
            docker image prune -f