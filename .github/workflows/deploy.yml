# Deploys to VPS on every push to main via Docker.
#
# One-time VPS setup:
#   1. Install Docker (and Docker Compose v2 if you use compose).
#   2. Create app dir, e.g. mkdir -p /var/www/pro-grid-generator && cd there.
#   3. Clone this repo (for docker-compose.yml / reference; image is pulled from GHCR).
#   4. Optional: docker compose pull && IMAGE=ghcr.io/OWNER/pro-grid-generator:latest docker compose up -d
#
# GitHub repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, GHCR_TOKEN (PAT with read:packages for pull on VPS)
# Optional variable: VPS_APP_PATH (defaults to /var/www/pro-grid-generator)

name: Deploy to VPS

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}:latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE }}
            docker stop pro-grid-generator 2>/dev/null || true
            docker rm pro-grid-generator 2>/dev/null || true
            docker run -d --name pro-grid-generator -p 3002:3000 --restart unless-stopped ${{ env.IMAGE }}
            docker image prune -f