# Release Please: automatic version + release notes from conventional commits.
# Use commits: feat: ..., fix: ..., chore: ... (or BREAKING CHANGE: for major).
# Runs on push to trunk; opens/updates a Release PR. When you merge that Release PR, the tag and GitHub Release are created (and Deploy runs).
#
# Required: add repo secret RELEASE_PLEASE_TOKEN (Personal Access Token with "repo" scope) so the workflow can create PRs.
# Create token: GitHub → Settings → Developer settings → Personal access tokens → Generate new token (classic) → tick "repo".

name: Release Please

on:
  push:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # v4 currently runs on deprecated Node 20; main declares Node 24.
      # Switch back to a stable major tag when release-please publishes one for Node 24.
      - uses: googleapis/release-please-action@main
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
