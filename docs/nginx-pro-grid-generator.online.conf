# Nginx config for pro-grid-generator.online
# Copy to VPS: /etc/nginx/sites-available/pro-grid-generator.online.conf
# Then: sudo ln -s /etc/nginx/sites-available/pro-grid-generator.online.conf /etc/nginx/sites-enabled/
# Run certbot after: sudo certbot --nginx -d pro-grid-generator.online -d www.pro-grid-generator.online

server {
    listen 80;
    listen [::]:80;
    server_name pro-grid-generator.online www.pro-grid-generator.online;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
